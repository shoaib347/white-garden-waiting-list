services:
  # 1. The Node.js Web Service (Backend + Frontend)
  - type: web
    name: white-garden-waitlist
    env: node
    # Render supports WebSockets automatically
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: white-garden-postgres
          property: connectionString
      - key: NODE_ENV
        value: production

  # 2. The PostgreSQL Database
  - type: psql
    name: white-garden-postgres
    plan: free # Free tier database
